name: Monitor PRO Expiry Refresher

on:
  schedule:
    # Runs every 5 minutes (Note: GitHub Actions delays cron execution during peak times)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh_check]

permissions:
  contents: write

jobs:
  check-and-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check Expiry & Refresh Playlists
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          python scripts/script2_checker.py

      - name: Commit & Push Updated cookies.json & url-log.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-refresh: Updated cookies.json and url-log.json [skip ci]"
          file_pattern: 'cookies.json url-log.json'

